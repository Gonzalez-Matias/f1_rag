# Tema claro, con el rojo del logo como acento,
# Barlow / Barlow Condensed / JetBrains Mono (incluidas en static/fuentes, licencia OFL).

[server]
enableStaticServing = true   # sirve static/ (tipografías y logo)

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#d92d23"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#14151c"
linkColor = "#c9281f"
codeTextColor = "#c9281f"
codeBackgroundColor = "#fdeeed"
borderColor = "#e3e4ea"
showSidebarBorder = false
baseRadius = "0.45rem"
font = "Barlow, sans-serif"
headingFont = "Barlow Condensed, Barlow, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
codeFont = "JetBrains Mono, monospace"

[theme.sidebar]
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#14151c"
primaryColor = "#d92d23"
codeBackgroundColor = "#fdeeed"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fuentes/Barlow-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fuentes/Barlow-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fuentes/Barlow-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fuentes/BarlowCondensed-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fuentes/BarlowCondensed-BoldItalic.ttf"
weight = 700
style = "italic"

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fuentes/BarlowCondensed-ExtraBoldItalic.ttf"
weight = 800
style = "italic"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fuentes/JetBrainsMono-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fuentes/JetBrainsMono-Bold.ttf"
weight = 700
